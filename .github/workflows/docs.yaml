name: 📚 Documentation
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (X.Y.Z); empty: the version in open_alaqs/metadata.txt"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Relative links and anchors of the Markdown files
        run: python3 tools/check_doc_links.py

      - name: Build the documentation site
        run: |
          pip install -r tools/docs_site/requirements.txt
          mkdocs build --strict -f tools/docs_site/mkdocs.yml -d "$RUNNER_TEMP/site"

  # Publishes one copy of the site per release (https://eurocontrol-asu.github.io/open_alaqs/<version>/)
  # and points "latest" at it, on a release tag or when started by hand. The copies are kept
  # on the gh-pages branch (mike); GitHub Pages serves that branch's content, deployed with
  # GitHub Actions (repository Settings > Pages > Source: GitHub Actions).
  deploy:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version to publish
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n 's/^version=//p' open_alaqs/metadata.txt)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing documentation version $version"

      - name: Build and add the version to gh-pages
        env:
          DOCS_GIT_REF: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          pip install -r tools/docs_site/requirements.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || true
          mike deploy -F tools/docs_site/mkdocs.yml --push --alias-type=copy \
            --update-aliases "${{ steps.version.outputs.version }}" latest
          mike set-default -F tools/docs_site/mkdocs.yml --push latest

      - name: Site content of gh-pages
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          git archive gh-pages | tar -x -C "$RUNNER_TEMP/pages"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages

      - id: deployment
        uses: actions/deploy-pages@v4
