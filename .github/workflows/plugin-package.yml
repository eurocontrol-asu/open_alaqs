name: 🔌 Plugin Package and Release

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - '*'
    branches:
      - main
  pull_request:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  plugin-package:
    name: Packages and releases plugin
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: 🐣 Checkout
        uses: actions/checkout@v5

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 🔨 Install qgis-plugin-ci
        run: pip install qgis-plugin-ci>=2.8.6

      - name: ©️ Copy license
        run: cp LICENSE open_alaqs/LICENSE

      - name: 📋️ Copy requirements.txt
        run: cp requirements.txt open_alaqs/requirements.txt

      - name: 📦 Package
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        run: |
          VERSION=0.0.0
          qgis-plugin-ci package ${VERSION} \
            --allow-uncommitted-changes \
            --asset-path open_alaqs/LICENSE \
            --asset-path open_alaqs/requirements.txt

      - name: 🌐️ Upload package
        uses: actions/upload-artifact@v4
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        with:
          name: open_alaqs_dev
          path: open_alaqs.0.0.0.zip
          if-no-files-found: error

      - name: 🧩️️ Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${{ github.ref_name }}
          qgis-plugin-ci release ${VERSION} \
            --allow-uncommitted-changes \
            --asset-path open_alaqs/LICENSE \
            --asset-path open_alaqs/requirements.txt \
            --github-token ${{ secrets.GITHUB_TOKEN }} # \
            # --osgeo-username ${{ secrets.OSGEO_PLUGIN_USERNAME }} \
            # --osgeo-password ${{ secrets.OSGEO_PLUGIN_PASSWORD }}
